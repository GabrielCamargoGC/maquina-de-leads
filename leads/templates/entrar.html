{% extends "base.html" %}
{% block titulo %}Entrar - Maquina de Leads{% endblock %}

{% block corpo %}
<div class="palco">
  <div class="palco-conteudo">
    <div class="lampada"></div>
    <p class="marca">Maquina de Leads</p>
    <h1>Entrar</h1>
    <p class="diz">Use seu usuario e senha.</p>

    {% if erro %}<div class="alerta alerta-erro" style="text-align:left">{{ erro }}</div>{% endif %}

    <form method="post" style="margin-top:22px">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <input type="hidden" name="proximo" value="{{ proximo }}">
      <div class="campo">
        <label for="usuario">Usuario</label>
        <input class="entrada" id="usuario" name="usuario" value="{{ usuario }}"
               autocomplete="username" autofocus required>
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input class="entrada" id="senha" name="senha" type="password"
               autocomplete="current-password" required>
      </div>
      <button class="botao primario largo" type="submit" style="margin-top:8px">Entrar</button>
    </form>

    <p class="link-abaixo">
      <a href="{{ url_for('acesso.recuperar') }}">Esqueci minha senha</a>
      &nbsp;&middot;&nbsp;
      <a href="{{ url_for('acesso.home') }}">Voltar</a>
    </p>
  </div>
</div>
{% endblock %}
